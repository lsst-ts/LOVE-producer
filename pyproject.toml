[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "LOVE-producer"
description = "LSST Operators Visualization Environment (LOVE) service that acts as middleware between the LOVE-manager and SAL using salobj."
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
urls = { documentation = "https://love-producer.lsst.io", source_code = "https://github.com/lsst-ts/LOVE-producer" }
dynamic = [ "version" ]

[project.scripts]
run_love_producer = "love.producer:run_love_producer"

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = [ "python" ]

[tool.setuptools_scm]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = ["documenteer[pipelines]"]
