[build-system]
requires = [ "setuptools", "setuptools_scm" ]
build-backend = "setuptools.build_meta"

[project]
name = "LOVE-producer"
description = "LSST Operators Visualization Environment (LOVE) service that acts as middleware between the LOVE-manager and SAL using salobj."
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
urls = { documentation = "https://love-producer.lsst.io", repository = "https://github.com/lsst-ts/LOVE-producer" }
dynamic = [ "version" ]

[project.scripts]
run_love_producer = "love.producer:run_love_producer"

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = [ "python" ]

[tool.setuptools_scm]
write_to = "python/love/producer/version.py"
write_to_template = """
# Generated by setuptools_scm
__all__ = ["__version__"]
__version__ = "{version}"
"""

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
  "documenteer[pipelines]",
]
